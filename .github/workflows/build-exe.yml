name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build FruitFlyRoblox.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name FruitFlyRoblox --paths . --collect-all PyQt6 --hidden-import=src --hidden-import=src.main --hidden-import=src.brain --hidden-import=src.vision --hidden-import=src.motor --hidden-import=src.monitor --hidden-import=src.fly3d --hidden-import=src.logger --hidden-import=src.config --hidden-import=src.roblox_launcher --hidden-import=src.trainer --hidden-import=src.motor_panel --hidden-import=src.input_lock --hidden-import=src.behavior --hidden-import=src.circuit --hidden-import=src.circuit_panel --hidden-import=src.mouse3d --hidden-import=src.host_learn --hidden-import=src.instincts --hidden-import=src.features --hidden-import=src.loot run_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: FruitFlyRoblox-windows
          path: dist/FruitFlyRoblox.exe
          if-no-files-found: error
