[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly-roblox-agent"
version = "1.0.0"
description = "Fruit fly brain simulation that plays Roblox autonomously — live monitor, action log, 3D fly on keyboard, dark theme."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "olliE bench" }]
dependencies = [
  "PyQt6>=6.6.0",
  "numpy>=1.26.0",
  "opencv-python>=4.8.0",
  "Pillow>=10.0.0",
  "pydirectinput>=1.0.4",
  "pygetwindow>=0.0.9",
  "pynput>=1.7.6",
  "mss>=9.0.0",
]

[project.scripts]
fruitfly-roblox = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
